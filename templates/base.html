{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SMS Guard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand logo-mark" href="{% url 'home' %}">🛡 SMS Guard</a>
      <span class="navbar-text text-white-50">Проект обнаружения SMS-мошенничества</span>
    </div>
  </header>
  <main class="container" id="main-content">{% block content %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
